[project]
name = "clin-genomic-analysis-benchmark"
version = "0.1.0"
description = "Benchmark for AI agentic workflows on translational clinical cancer-data analysis (AACR Project GENIE BPC cohorts)."
requires-python = ">=3.11"
authors = [{ name = "Kenneth Kehl" }]
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic[vertex]>=0.42.0",
    "openai>=1.40.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "lifelines>=0.27.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "jsonschema>=4.20.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
clingen-bench = "clin_genomic_analysis_benchmark.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clin_genomic_analysis_benchmark"]

[tool.hatch.build.targets.sdist]
include = ["clin_genomic_analysis_benchmark", "adapters", "scoring_configs", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
